<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0e1f">
  <title>Snakopouille</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8ebff; font-family: sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-top { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); text-align: center; }
    .hud-clock { font: bold 28px monospace; color: #fff; text-shadow: 0 0 6px #4af0ff; }
    .hud-clock.fever { color: #ff4af0; text-shadow: 0 0 8px #ff4af0; }
    .hud-fever { font: bold 14px sans-serif; color: #ff4af0; letter-spacing: 2px; }
    .hud-panel { position: absolute; top: 8px; min-width: 150px; padding: 8px 10px; border-radius: 8px; background: #ffffff14; font-size: 14px; }
    .hud-left { left: 8px; }
    .hud-right { right: 8px; }
    .hud-title { font-size: 11px; color: #9aa3d0; letter-spacing: 1px; margin-bottom: 4px; }
    .hud-row { white-space: nowrap; line-height: 1.4; }
    .hud-row.own { font-weight: bold; }
    .hud-center { position: absolute; top: 45%; width: 100%; text-align: center; font: bold 32px sans-serif; color: #fff; text-shadow: 0 0 10px #000; }
    .hud-bonus { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .hud-chip { position: relative; overflow: hidden; min-width: 64px; padding: 4px 10px 8px; border: 2px solid; border-radius: 12px;
      background: #0b0e1fcc; font: bold 18px sans-serif; color: #fff; text-align: center; white-space: nowrap; }
    .hud-chip-icon { margin-right: 6px; }
    .hud-chip-bar { position: absolute; left: 0; bottom: 0; height: 4px; transition: width 0.2s linear; }
    #boost { position: fixed; right: 24px; bottom: 24px; width: 88px; height: 88px; border-radius: 50%;
      border: 3px solid #ff4af0; background: #ff4af033; color: #ff4af0; font: bold 34px sans-serif; touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #boost:active { background: #ff4af088; }
    #menu { position: fixed; left: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid #9aa3d0; background: #9aa3d022; color: #e8ebff; font: bold 26px sans-serif; touch-action: manipulation;
      -webkit-touch-callout: none; }
    #menu:active { background: #9aa3d066; }
    #confirm { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000a; }
    #end { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000c; }
    .end-box { background: #0b0e1f; border: 2px solid #4af0ff; border-radius: 16px; padding: 20px 28px; text-align: center; }
    .end-box h1 { margin: 0 0 12px; color: #4af0ff; }
    .end-box table { border-collapse: collapse; margin: 0 auto 16px; font-size: 18px; }
    .end-box th, .end-box td { padding: 6px 12px; }
    .end-box th { color: #9aa3d0; font-size: 13px; }
    .end-box button { font: bold 20px sans-serif; padding: 14px 32px; border: 0; border-radius: 12px; background: #5dff8a; color: #0b0e1f; }
    #portrait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e1f; font: bold 28px sans-serif; color: #4af0ff; }
    #fps { position: fixed; left: 96px; bottom: 8px; font: 12px monospace; color: #5dff8a; background: #000a; padding: 4px 6px; border-radius: 4px; pointer-events: none; }
    body:not(.in-game) #game, body:not(.in-game) #hud, body:not(.in-game) #boost, body:not(.in-game) #menu { display: none; }
    body:not(.in-game) { overflow-y: auto; background: #0b0e1f; }
    #home, #lobby { position: relative; min-height: 100%; display: flex; justify-content: center; padding: 16px; box-sizing: border-box; }
    .screen-box { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
    .screen-box h1 { margin: 4px 0; color: #4af0ff; text-shadow: 0 0 8px #4af0ff; text-align: center; }
    .screen-box h2 { margin: 10px 0 0; font-size: 14px; color: #9aa3d0; letter-spacing: 1px; text-transform: uppercase; }
    .screen-box input { font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 2px solid #1b2140; background: #11152b; color: #e8ebff; }
    .screen-box button { font: bold 17px sans-serif; padding: 12px 18px; border: 2px solid #4af0ff; border-radius: 12px; background: #4af0ff1f; color: #e8ebff; }
    .screen-box button:disabled { opacity: 0.4; }
    .screen-box button.primary { background: #5dff8a; border-color: #5dff8a; color: #0b0e1f; }
    .screen-box button.secondary { border-color: #9aa3d0; background: transparent; }
    .status { min-height: 1.2em; margin: 0; color: #ffd84a; text-align: center; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .screen-box .swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
    .screen-box .swatch.selected { border-color: #fff; box-shadow: 0 0 8px #fff; }
    .screen-box .swatch:disabled { opacity: 0.15; }
    .games { display: flex; flex-direction: column; gap: 6px; color: #9aa3d0; }
    .game-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #e8ebff; }
    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 4px; }
    .players { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 18px; }
    .players .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
    .end-note { color: #9aa3d0; margin: 0 0 12px; }
    .end-buttons { display: flex; gap: 12px; justify-content: center; }
  </style>
</head>
<body>
  <div id="home" style="display:none"></div>
  <div id="lobby" style="display:none"></div>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <button id="boost" aria-label="Accélérer">»</button>
  <button id="menu" aria-label="Retour au menu">☰</button>
  <div id="fps"></div>
  <div id="end" style="display:none"></div>
  <div id="confirm" style="display:none"></div>
  <div id="portrait" style="display:none"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
